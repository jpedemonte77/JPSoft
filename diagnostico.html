<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<!-- El mismo manifest y el mismo service worker que index.html, para que
     Chrome evalue exactamente las mismas condiciones de instalacion. -->
<link rel="manifest" href="/JPSoft/manifest.json">
<title>Diagnóstico de instalación</title>
<style>
  :root{
    --fondo:#f6f6f4; --tarjeta:#fff; --texto:#111; --suave:#8a8a85;
    --linea:rgba(0,0,0,.09);
    --ok:#1b7a3d; --ok-bg:#e8f5ec;
    --mal:#b3261e; --mal-bg:#fdecea;
    --ojo:#8a5a00; --ojo-bg:#fff5e0;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --fondo:#141414; --tarjeta:#1d1d1d; --texto:#f2f2f0; --suave:#9a9a94;
      --linea:rgba(255,255,255,.12);
      --ok:#6ddc92; --ok-bg:#15301f;
      --mal:#ff8b80; --mal-bg:#331a17;
      --ojo:#ffcc66; --ojo-bg:#332a12;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:16px; background:var(--fondo); color:var(--texto);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    -webkit-text-size-adjust:100%;
  }
  .envoltorio{max-width:620px; margin:0 auto}
  h1{font-size:20px; font-weight:600; margin:4px 0 2px}
  .bajada{color:var(--suave); font-size:13.5px; margin:0 0 18px}
  .tarjeta{
    background:var(--tarjeta); border:1px solid var(--linea); border-radius:14px;
    padding:14px 16px; margin-bottom:12px;
  }
  .tarjeta h2{font-size:12px; font-weight:600; letter-spacing:.07em;
    text-transform:uppercase; color:var(--suave); margin:0 0 10px}
  .fila{display:flex; gap:10px; align-items:flex-start; padding:7px 0;
    border-top:1px solid var(--linea)}
  .fila:first-of-type{border-top:0}
  .rotulo{flex:0 0 40%; color:var(--suave); font-size:13.5px; min-width:0}
  .valor{flex:1; min-width:0; font-size:14px; word-break:break-word}
  .chip{display:inline-block; padding:2px 9px; border-radius:999px;
    font-size:12px; font-weight:600; white-space:nowrap}
  .c-ok{background:var(--ok-bg); color:var(--ok)}
  .c-mal{background:var(--mal-bg); color:var(--mal)}
  .c-ojo{background:var(--ojo-bg); color:var(--ojo)}
  .nota{font-size:13px; color:var(--suave); margin-top:4px; line-height:1.45}
  .veredicto{border-width:2px; border-style:solid; border-radius:14px;
    padding:15px 16px; margin-bottom:14px; font-size:15px; line-height:1.55}
  .v-ok{border-color:var(--ok); background:var(--ok-bg)}
  .v-mal{border-color:var(--mal); background:var(--mal-bg)}
  .v-ojo{border-color:var(--ojo); background:var(--ojo-bg)}
  .veredicto b{display:block; margin-bottom:5px; font-size:16px}
  button{
    width:100%; padding:13px; border-radius:11px; border:1px solid var(--texto);
    background:var(--texto); color:var(--fondo); font-size:15px; font-weight:600;
    font-family:inherit; margin-top:10px; cursor:pointer;
  }
  button.secundario{background:transparent; color:var(--texto)}
  button:disabled{opacity:.4}
  pre{
    background:var(--fondo); border:1px solid var(--linea); border-radius:10px;
    padding:11px; font-size:11px; line-height:1.45; overflow-x:auto;
    white-space:pre-wrap; word-break:break-word; margin:10px 0 0;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
</style>
</head>
<body>
<div class="envoltorio">

  <h1>Diagnóstico de instalación</h1>
  <p class="bajada">Dietética Josué · abrí esta página en el teléfono que no ofrece instalar</p>

  <div id="veredicto"></div>

  <div class="tarjeta">
    <h2>Navegador y equipo</h2>
    <div id="navegador"></div>
  </div>

  <div class="tarjeta">
    <h2>Requisitos de la app</h2>
    <div id="requisitos"></div>
  </div>

  <div class="tarjeta">
    <h2>Instalación</h2>
    <div id="instalacion"></div>
    <button id="btnInstalar" disabled>Esperando a Chrome...</button>
  </div>

  <div class="tarjeta">
    <h2>Para pasarme el resultado</h2>
    <button class="secundario" id="btnCopiar">Copiar todo el informe</button>
    <pre id="informe">Recolectando datos...</pre>
  </div>

</div>

<script>
// ══════════════════════════════════════════════════════════════════
//  El evento de instalacion puede llegar enseguida, asi que se escucha
//  ANTES de cualquier otra cosa. Si se escuchara despues, se perderia.
// ══════════════════════════════════════════════════════════════════
let eventoInstalar = null;
let llegoEvento = false;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  eventoInstalar = e;
  llegoEvento = true;
  pintarInstalacion();
  pintarVeredicto();
});

// ── Chrome no ofrece instalar hasta que el usuario DEMUESTRA interes:
//    hace falta al menos un toque en la pagina y 30 segundos de uso.
//    Sin esto, el diagnostico daria un "no se puede instalar" falso.
const ARRANQUE = Date.now();
let toques = 0;
['pointerdown','keydown'].forEach(ev =>
  addEventListener(ev, () => { toques++; }, {passive:true, capture:true}));
const segundos = () => Math.floor((Date.now() - ARRANQUE) / 1000);
const engagementListo = () => toques > 0 && segundos() >= 30;
let yaInstalada = false;
window.addEventListener('appinstalled', () => { yaInstalada = true; pintarVeredicto(); });

const datos = {};          // todo lo que se junta, para el informe de texto

function fila(rotulo, valor, estado, nota){
  const chip = estado ? `<span class="chip c-${estado}">${valor}</span>` : valor;
  return `<div class="fila"><div class="rotulo">${rotulo}</div>` +
         `<div class="valor">${chip}${nota ? `<div class="nota">${nota}</div>` : ''}</div></div>`;
}

// ── 1. Navegador y equipo ─────────────────────────────────────────
function analizarNavegador(){
  const ua = navigator.userAgent;
  datos.ua = ua;

  const mChrome  = ua.match(/Chrome\/(\d+)/);
  const mAndroid = ua.match(/Android (\d+(?:\.\d+)?)/);
  const esWebView = /;\s*wv\)/.test(ua) || /\bFBAN|FBAV|Instagram|Line\/|WhatsApp/i.test(ua);
  const otroNav =
      /MiuiBrowser\/([\d.]+)/.test(ua) ? 'Mi Browser (Xiaomi)' :
      /SamsungBrowser/.test(ua)        ? 'Samsung Internet'    :
      /\bOPR\/|\bOpera/.test(ua)       ? 'Opera'               :
      /EdgA?\//.test(ua)               ? 'Edge'                :
      /Firefox|FxiOS/.test(ua)         ? 'Firefox'             : null;

  datos.chrome   = mChrome ? mChrome[1] : null;
  datos.android  = mAndroid ? mAndroid[1] : null;
  datos.webview  = esWebView;
  datos.otroNav  = otroNav;
  datos.memoria  = navigator.deviceMemory || navigator.hardwareConcurrency || null;

  let h = '';
  // Chrome miente a proposito en el user agent: congela la version de Android
  // en "10" y el modelo en "K" para todos los equipos. La version real sólo
  // se consigue por Client Hints, que se piden aparte.
  h += fila('Android (según el UA)', datos.android || 'no es Android',
    datos.android === '10' ? 'ojo' : null,
    datos.android === '10'
      ? 'Chrome informa «10» en todos los teléfonos por privacidad: no es la ' +
        'versión real. La verdadera aparece en la línea de abajo.'
      : null);
  h += '<div id="filaReal"></div>';

  if(esWebView){
    h += fila('Navegador', 'navegador interno de otra app', 'mal',
      'Abriste el enlace desde WhatsApp, Instagram o similar. Ese visor no puede ' +
      'instalar aplicaciones. Toca los tres puntos y elegí «Abrir en Chrome».');
  } else if(otroNav){
    h += fila('Navegador', otroNav, 'ojo',
      'No es Chrome. Abrí la dirección en Chrome para poder instalar.');
  } else if(mChrome){
    const v = parseInt(mChrome[1], 10);
    h += fila('Chrome', 'versión ' + v, v >= 90 ? 'ok' : 'mal',
      v >= 90 ? null : 'Chrome está muy viejo. Actualizalo desde Play Store.');
  } else {
    h += fila('Navegador', 'no se pudo identificar', 'ojo');
  }

  // isSecureContext es exactamente la condicion que mira Chrome: cubre
  // https y tambien localhost, que tambien cuenta como seguro.
  const https = window.isSecureContext === true;
  datos.https = https;
  datos.protocolo = location.protocol;
  h += fila('Conexión segura', https ? 'sí (' + location.protocol + ')' : location.protocol,
    https ? 'ok' : 'mal',
    https ? null : 'Sin HTTPS no se puede instalar. Entrá por https://');

  const modo = matchMedia('(display-mode: standalone)').matches ||
               matchMedia('(display-mode: fullscreen)').matches ||
               matchMedia('(display-mode: minimal-ui)').matches ||
               navigator.standalone === true;
  datos.modoApp = modo;
  if(modo){
    h += fila('Cómo se abrió', 'como aplicación', 'ok',
      'Ya estás usando la app instalada, no el navegador. Por eso no aparece la opción.');
  } else {
    h += fila('Cómo se abrió', 'en una pestaña del navegador');
  }

  let guardado = 'sí';
  try{ localStorage.setItem('_p','1'); localStorage.removeItem('_p'); }
  catch(e){ guardado = 'bloqueado'; }
  datos.guardado = guardado;
  h += fila('Guardar datos del sitio', guardado, guardado === 'sí' ? 'ok' : 'mal',
    guardado === 'sí' ? null :
    'Chrome tiene bloqueado el almacenamiento (suele pasar en modo incógnito o ' +
    'con las cookies bloqueadas). Sin esto no se puede instalar.');

  document.getElementById('navegador').innerHTML = h;
  versionReal();
}

// La version de Android y el modelo de verdad, por Client Hints
async function versionReal(){
  const caja = document.getElementById('filaReal');
  if(!caja) return;
  if(!(navigator.userAgentData && navigator.userAgentData.getHighEntropyValues)){
    caja.innerHTML = fila('Android (real)', 'el navegador no lo informa');
    return;
  }
  try{
    const d = await navigator.userAgentData.getHighEntropyValues(
      ['platformVersion','model','fullVersionList']);
    datos.androidReal = d.platformVersion || null;
    datos.modelo = d.model || null;
    const chromeReal = (d.fullVersionList || [])
      .filter(x => /Chrome/i.test(x.brand)).map(x => x.version)[0];
    datos.chromeReal = chromeReal || null;
    let h = fila('Android (real)', d.platformVersion || 'no informado');
    if(d.model) h += fila('Modelo', d.model);
    caja.innerHTML = h;
  }catch(e){
    caja.innerHTML = fila('Android (real)', 'no se pudo consultar');
  }
  pintarInforme();
}

// ── 2. Requisitos: manifest, iconos, service worker, espacio ──────
async function analizarRequisitos(){
  let h = '';

  // ¿Está declarado el manifest en esta página?
  const link = document.querySelector('link[rel="manifest"]');
  h += fila('Manifest declarado', link ? 'sí' : 'no', link ? 'ok' : 'mal');

  // ¿Se puede descargar y entender?
  let man = null;
  try{
    const r = await fetch('/JPSoft/manifest.json', {cache:'no-store'});
    datos.manifestHTTP = r.status;
    if(r.ok){
      man = await r.json();
      h += fila('Descarga del manifest', 'HTTP ' + r.status, 'ok');
    } else {
      h += fila('Descarga del manifest', 'HTTP ' + r.status, 'mal',
        'El archivo manifest.json no está donde se lo busca.');
    }
  }catch(e){
    datos.manifestError = String(e);
    h += fila('Descarga del manifest', 'falló', 'mal', String(e));
  }

  if(man){
    datos.declaraRelacionadas = Array.isArray(man.related_applications) &&
                                man.related_applications.length > 0;
    datos.manifest = {name:man.name, short_name:man.short_name, display:man.display,
                      start_url:man.start_url, scope:man.scope,
                      iconos:(man.icons||[]).length,
                      prefer_related_applications:man.prefer_related_applications,
                      related_applications:datos.declaraRelacionadas};

    // Si esto fuera true, Chrome manda a Play Store y nunca ofrece instalar
    if(man.prefer_related_applications === true){
      h += fila('prefer_related_applications', 'true', 'mal',
        'Con esto en true Chrome nunca ofrece instalar la web: te manda a ' +
        'Play Store. Tiene que ser false o no estar.');
    }
    const nom = man.name || man.short_name;
    h += fila('Nombre', nom || 'falta', nom ? 'ok' : 'mal');
    h += fila('display', man.display || 'falta',
      ['standalone','fullscreen','minimal-ui'].includes(man.display) ? 'ok' : 'mal',
      ['standalone','fullscreen','minimal-ui'].includes(man.display) ? null :
      'Con display «browser» Chrome no ofrece instalar.');

    // Cada icono tiene que existir de verdad
    const iconos = man.icons || [];
    const grandes = iconos.filter(i => /(^|\s)(192|512)x\2($|\s)/.test(i.sizes || '') ||
                                       /512x512|192x192/.test(i.sizes || ''));
    h += fila('Iconos 192 y 512', grandes.length >= 2 ? 'los dos' : grandes.length + ' de 2',
      grandes.length >= 2 ? 'ok' : 'mal');

    datos.iconos = [];
    for(const ico of iconos){
      try{
        const r = await fetch(ico.src, {cache:'no-store'});
        const tipo = r.headers.get('content-type') || '?';
        datos.iconos.push({src:ico.src, http:r.status, tipo});
        h += fila(ico.sizes || 'icono', 'HTTP ' + r.status, r.ok ? 'ok' : 'mal',
          r.ok ? ico.src : 'No se encontró: ' + ico.src);
      }catch(e){
        datos.iconos.push({src:ico.src, error:String(e)});
        h += fila(ico.sizes || 'icono', 'falló', 'mal', ico.src);
      }
    }
  }

  // Service worker
  if(!('serviceWorker' in navigator)){
    datos.sw = 'no soportado';
    h += fila('Service worker', 'no soportado', 'mal',
      'Este navegador no soporta service workers, así que no puede instalar la app.');
  } else {
    try{
      await navigator.serviceWorker.register('/JPSoft/sw.js');
      // Recien registrado tarda un instante en activarse. Se le da tiempo
      // para no informar un "instalandose" que en realidad ya terminó.
      await Promise.race([
        navigator.serviceWorker.ready,
        new Promise(r => setTimeout(r, 6000))
      ]);
      const reg = await navigator.serviceWorker.getRegistration('/JPSoft/');
      if(reg){
        const estado = reg.active ? 'activo' : (reg.installing ? 'instalándose' : 'esperando');
        datos.sw = {estado, scope:reg.scope, controla:!!navigator.serviceWorker.controller};
        h += fila('Service worker', estado, reg.active ? 'ok' : 'ojo', reg.scope);
        h += fila('Controla la página',
          navigator.serviceWorker.controller ? 'sí' : 'todavía no',
          navigator.serviceWorker.controller ? 'ok' : 'ojo',
          navigator.serviceWorker.controller ? null : 'Recargá la página una vez.');
      } else {
        datos.sw = 'sin registro';
        h += fila('Service worker', 'no se registró', 'mal');
      }
    }catch(e){
      datos.sw = String(e);
      h += fila('Service worker', 'error', 'mal', String(e));
    }
  }

  // Espacio libre: sin espacio, Android no puede crear el acceso directo
  if(navigator.storage && navigator.storage.estimate){
    try{
      const s = await navigator.storage.estimate();
      const mb = n => (n/1048576).toFixed(1) + ' MB';
      const libre = (s.quota || 0) - (s.usage || 0);
      datos.espacio = {usado:s.usage, cupo:s.quota};
      h += fila('Espacio para el sitio', mb(libre) + ' libres',
        libre > 50*1048576 ? 'ok' : 'ojo',
        libre > 50*1048576 ? null :
        'Queda poquísimo espacio. Si el teléfono está lleno, Android no puede ' +
        'crear la aplicación. Liberá espacio y probá de nuevo.');
    }catch(e){ /* no es critico */ }
  }

  document.getElementById('requisitos').innerHTML = h;
  pintarVeredicto();
  pintarInforme();
}

// ── 3. Instalación ────────────────────────────────────────────────
async function pintarInstalacion(){
  let h = '';

  // ¿Ya está instalada? Chrome lo sabe y es la causa mas comun de que
  // no aparezca la opcion.
  if(navigator.getInstalledRelatedApps){
    try{
      const apps = await navigator.getInstalledRelatedApps();
      datos.instaladas = apps.map(a => a.platform + ':' + (a.id || a.url || ''));
      if(apps.length){
        h += fila('¿Ya está instalada?', 'SÍ', 'ojo',
          'Chrome no ofrece instalar algo que ya está instalado. Buscá el icono ' +
          '«Dietética Josué» en el cajón de aplicaciones.');
      } else if(datos.declaraRelacionadas){
        h += fila('¿Ya está instalada?', 'no', 'ok');
      } else {
        // Sin related_applications en el manifest, esta consulta devuelve
        // una lista vacia aunque la app ESTE instalada: no prueba nada.
        h += fila('¿Ya está instalada?', 'no se puede saber', 'ojo',
          'El manifest no declara related_applications, así que esta consulta ' +
          'siempre da vacío. Comprobalo a mano en el cajón de aplicaciones.');
      }
    }catch(e){
      datos.instaladas = 'no se pudo consultar';
      h += fila('¿Ya está instalada?', 'no se pudo consultar');
    }
  } else {
    h += fila('¿Ya está instalada?', 'el navegador no lo informa');
  }

  // Chrome exige un toque + 30 segundos antes de ofrecer la instalacion
  datos.toques = toques;
  datos.segundos = segundos();
  const listo = engagementListo();
  h += fila('Uso de la página',
    toques + (toques === 1 ? ' toque' : ' toques') + ' · ' + segundos() + ' s',
    listo ? 'ok' : 'ojo',
    listo ? null :
    'Chrome pide al menos <b>un toque en la pantalla y 30 segundos</b> en la ' +
    'página antes de ofrecer instalar. Tocá acá y esperá, sin cerrar.');

  datos.beforeinstallprompt = llegoEvento;
  h += fila('Chrome ofrece instalar', llegoEvento ? 'SÍ' : 'todavía no',
    llegoEvento ? 'ok' : 'ojo',
    llegoEvento
      ? 'Apretá el botón de abajo para instalarla ahora mismo.'
      : (listo
          ? 'Ya se cumplieron el toque y los 30 segundos y Chrome sigue sin ' +
            'ofrecerla: el bloqueo es de este teléfono.'
          : 'Todavía no se cumplieron el toque y los 30 segundos. Esperá, esto ' +
            'se actualiza solo.'));

  document.getElementById('instalacion').innerHTML = h;

  const btn = document.getElementById('btnInstalar');
  btn.disabled = !llegoEvento;
  btn.textContent = llegoEvento ? 'Instalar Dietética Josué' : 'Esperando a Chrome...';
  pintarInforme();
}

document.getElementById('btnInstalar').addEventListener('click', async () => {
  if(!eventoInstalar) return;
  const btn = document.getElementById('btnInstalar');
  btn.disabled = true;
  btn.textContent = 'Instalando...';
  try{
    await eventoInstalar.prompt();
    const r = await eventoInstalar.userChoice;
    datos.resultadoInstalar = r && r.outcome;
    btn.textContent = (r && r.outcome === 'accepted')
      ? 'Instalada' : 'Cancelaste la instalación';
    if(!r || r.outcome !== 'accepted') btn.disabled = false;
  }catch(e){
    datos.resultadoInstalar = String(e);
    btn.textContent = 'Falló: ' + e.message;
  }
  pintarInforme();
});

// ── Veredicto en una frase ────────────────────────────────────────
function pintarVeredicto(){
  let clase = 'v-ojo', titulo = 'Revisando...', texto = 'Esperá unos segundos.';

  if(datos.webview){
    clase = 'v-mal'; titulo = 'No estás en Chrome';
    texto = 'Abriste el enlace desde el navegador interno de otra app (WhatsApp, ' +
            'Instagram). Ese visor nunca puede instalar. Tocá los tres puntos ' +
            'arriba a la derecha y elegí «Abrir en Chrome».';
  } else if(datos.otroNav){
    clase = 'v-mal'; titulo = 'No estás en Chrome, sino en ' + datos.otroNav;
    texto = 'Copiá la dirección y abrila en Chrome.';
  } else if(datos.modoApp){
    clase = 'v-ok'; titulo = 'Ya está instalada';
    texto = 'Esta ventana ES la aplicación instalada, no el navegador. Por eso no ' +
            'aparece la opción de instalar.';
  } else if(datos.guardado === 'bloqueado'){
    clase = 'v-mal'; titulo = 'Chrome tiene bloqueado el almacenamiento';
    texto = 'Suele ser modo incógnito, o las cookies bloqueadas para este sitio. ' +
            'Salí del incógnito y permití cookies.';
  } else if(datos.https === false){
    clase = 'v-mal'; titulo = 'Falta HTTPS';
    texto = 'Entrá a la dirección con https:// adelante.';
  } else if(llegoEvento){
    clase = 'v-ok'; titulo = 'Se puede instalar en este teléfono';
    texto = 'Chrome dice que sí. Usá el botón «Instalar Dietética Josué» de esta ' +
            'misma página. Si el menú de Chrome no te mostraba la opción, era un ' +
            'problema del menú, no de la app.';
  } else if(datos.instaladas && datos.instaladas.length){
    clase = 'v-ojo'; titulo = 'Parece que ya está instalada';
    texto = 'Buscá «Dietética Josué» en el cajón de aplicaciones. Si querés ' +
            'reinstalarla, desinstalala primero y volvé a entrar acá.';
  } else if(datos.manifest && !engagementListo()){
    // Antes del toque + 30 s, que Chrome no ofrezca instalar no significa nada
    clase = 'v-ojo'; titulo = 'Esperando: faltan ' + Math.max(0, 30 - segundos()) + ' s';
    texto = toques === 0
      ? 'Tocá una vez la pantalla y dejá esta página abierta 30 segundos. Chrome ' +
        'no ofrece instalar hasta que ve que usaste el sitio. Esto se actualiza solo.'
      : 'Ya tocaste la pantalla. Dejá la página abierta hasta llegar a los 30 ' +
        'segundos, sin cambiar de pestaña. Esto se actualiza solo.';
  } else if(datos.manifestHTTP && datos.manifestHTTP >= 400){
    clase = 'v-mal'; titulo = 'No se encuentra el manifest';
    texto = 'El archivo manifest.json no está accesible desde este teléfono.';
  } else if(datos.sw && typeof datos.sw === 'string'){
    clase = 'v-mal'; titulo = 'Problema con el service worker';
    texto = String(datos.sw);
  } else if(datos.manifest){
    clase = 'v-ojo'; titulo = 'La app cumple todo, pero Chrome no ofrece instalar';
    texto = 'Manifest, iconos y service worker están bien, y ya pasaron el toque y ' +
            'los 30 segundos. Entonces, o ya está instalada (fijate en el cajón de ' +
            'aplicaciones), o faltan los Servicios de Google Play en este teléfono. ' +
            'Pasame el informe de abajo.';
  }

  document.getElementById('veredicto').innerHTML =
    `<div class="veredicto ${clase}"><b>${titulo}</b>${texto}</div>`;
}

// ── Informe de texto para copiar y pegar ──────────────────────────
function pintarInforme(){
  document.getElementById('informe').textContent =
    'DIAGNÓSTICO PWA · Dietética Josué\n' +
    new Date().toLocaleString('es-AR') + '\n' +
    location.href + '\n\n' +
    JSON.stringify(datos, null, 2);
}

document.getElementById('btnCopiar').addEventListener('click', async () => {
  const btn = document.getElementById('btnCopiar');
  const txt = document.getElementById('informe').textContent;
  try{
    await navigator.clipboard.writeText(txt);
    btn.textContent = 'Copiado';
  }catch(e){
    const r = document.createRange();
    r.selectNodeContents(document.getElementById('informe'));
    getSelection().removeAllRanges(); getSelection().addRange(r);
    btn.textContent = 'Seleccionado: copialo a mano';
  }
  setTimeout(() => btn.textContent = 'Copiar todo el informe', 2500);
});

// ── Arranque ──────────────────────────────────────────────────────
analizarNavegador();
pintarInstalacion();
pintarVeredicto();
analizarRequisitos();
// Chrome no decide al instante: pide un toque y 30 segundos de uso. Se sigue
// mirando cada 2 segundos durante un minuto y medio, que es de sobra.
const reloj = setInterval(() => {
  pintarInstalacion();
  pintarVeredicto();
  if(llegoEvento || segundos() > 90) clearInterval(reloj);
}, 2000);
</script>
</body>
</html>
