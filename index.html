<title>dietética josué</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;height:100dvh;overflow:hidden}
body{font-family:'DM Sans',system-ui,sans-serif;background:#f7f7f8;color:#111;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1rem}
.card{background:#fff;border:1px solid rgba(0,0,0,0.08);border-radius:14px;padding:2.5rem 2rem;width:100%;max-width:360px;text-align:center}
.brand{font-size:18px;font-weight:600;color:#111;margin-bottom:6px}
.sub{font-size:13px;color:#999;margin-bottom:2rem}
.divider{height:1px;background:rgba(0,0,0,0.06);margin-bottom:1.5rem}
a{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:13px 16px;border-radius:8px;text-decoration:none;border:1px solid rgba(0,0,0,0.1);background:#fff;color:#111;font-weight:500;font-size:14px;transition:all .15s}
a:last-child{margin-bottom:0}
a:hover{background:#f7f7f8;border-color:rgba(0,0,0,0.2)}
a.primary{background:#111;color:#fff;border-color:#111}
a.primary:hover{background:#333;border-color:#333}
.arrow{font-size:16px;opacity:.5}
a.primary .arrow{opacity:.7}

/* Credito del desarrollador */
.credito{text-align:center}
.credito .cr-sep{height:1px;background:rgba(0,0,0,0.08);margin:0 auto 14px;max-width:320px}
.credito .cr-dev{font-size:13px;color:#999;margin-bottom:8px}
.credito .cr-wa{display:inline-flex;align-items:center;gap:7px;font-size:13px;
  color:#333;text-decoration:none;transition:opacity .15s}
.credito .cr-wa:hover{opacity:.7}
.credito .cr-wa img{width:17px;height:17px;flex-shrink:0}
/* Credito: fuera de la tarjeta, apoyado sobre el fondo */
.credito{width:100%;max-width:360px;margin:2.2rem auto 0;padding-top:1.7rem;
  border-top:1px solid rgba(0,0,0,0.07)}
.credito .cr-sep{display:none}
.credito .cr-dev{font-size:12.5px;color:#a8a8ad;margin-bottom:8px;font-weight:400}
.credito a.cr-wa{display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:none;background:none;padding:0;margin:0;border-radius:0;
  font-size:12.5px;font-weight:400;color:#6b6b70}
.credito a.cr-wa:hover{background:none;border:none;opacity:.7}
.credito a.cr-wa img{width:16px;height:16px}
.card{max-width:360px}
.brand img{width:100%;max-width:215px;height:auto;display:block;margin:0 auto}
</style>
